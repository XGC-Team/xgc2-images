name: reusable-publish-manifest

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY || secrets.XGC_CN_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE || secrets.XGC_CN_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME || secrets.XGC_CN_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD || secrets.XGC_CN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1"
            local target="$2"
            shift 2
            local refs=()
            local arch
            for arch in "$@"; do
              refs+=("${image}:${target}-${arch}")
            done
            docker buildx imagetools create -t "${image}:${target}" "${refs[@]}"
          }

          mapfile -t arches < <(jq -r '.[]' <<< '${{ toJson(matrix.arches) }}')
          create_manifest "${{ matrix.image }}" "${{ matrix.version }}" "${arches[@]}"
          create_manifest "${{ matrix.image }}" "latest" "${arches[@]}"

          if [[ -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            create_manifest "${extra_image}" "${{ matrix.version }}" "${arches[@]}"
            create_manifest "${extra_image}" "latest" "${arches[@]}"
          fi
