name: reusable-publish-manifest

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
      LATEST_ONLY: ${{ github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci-registry-roots.sh
          source scripts/ci-registry-roots.sh
          image="$(rewrite_ghcr "${{ matrix.image }}")"

          create_manifest() {
            local image="$1"
            local target="$2"
            shift 2
            local refs=()
            local arch
            for arch in "$@"; do
              refs+=("${image}:${target}-${arch}")
            done
            docker buildx imagetools create -t "${image}:${target}" "${refs[@]}"
          }

          mapfile -t arches < <(jq -r '.[]' <<< '${{ toJson(matrix.arches) }}')
          if [[ "${LATEST_ONLY}" != "true" ]]; then
            create_manifest "${image}" "${{ matrix.version }}" "${arches[@]}"
          fi
          create_manifest "${image}" "latest" "${arches[@]}"

          if [[ -n "${EXTRA_ROOT}" ]]; then
            extra_image="${EXTRA_ROOT}/${{ matrix.app }}"
            if [[ "${LATEST_ONLY}" != "true" ]]; then
              create_manifest "${extra_image}" "${{ matrix.version }}" "${arches[@]}"
            fi
            create_manifest "${extra_image}" "latest" "${arches[@]}"
          fi
