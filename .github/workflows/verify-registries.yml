name: Verify registries

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ vars.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check extra registry config
        id: extra
        run: |
          set -euo pipefail
          present=0
          for key in EXTRA_REGISTRY EXTRA_USERNAME EXTRA_PASSWORD; do
            if [[ -n "${!key}" ]]; then
              echo "${key} is set"
              present=$((present + 1))
            else
              echo "${key} is empty"
            fi
          done
          if [[ -n "${EXTRA_NAMESPACE}" ]]; then
            echo "EXTRA_NAMESPACE is set"
          else
            echo "EXTRA_NAMESPACE is empty"
          fi
          if [[ "${present}" -eq 3 && -n "${EXTRA_NAMESPACE}" ]]; then
            echo "extra=1" >> "${GITHUB_OUTPUT}"
          elif [[ "${present}" -eq 0 ]]; then
            echo "extra=0" >> "${GITHUB_OUTPUT}"
          else
            echo "extra registry is partially configured" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.extra.outputs.extra == '1'
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Probe registry API
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci-registry-roots.sh
          source scripts/ci-registry-roots.sh
          if [[ -z "${GHCR_ROOT}" ]]; then
            echo "GHCR root was not resolved" >&2
            exit 1
          fi
          echo "GHCR docker login already succeeded"
          if [[ "${{ steps.extra.outputs.extra }}" != "1" ]]; then
            echo "extra registry not configured; skipping extra probe"
            exit 0
          fi
          if [[ -z "${EXTRA_ROOT}" ]]; then
            echo "extra registry root was not resolved" >&2
            exit 1
          fi
          # docker login already completed the Bearer token dance. Harbor-style
          # registries still return 401 for Basic on /v2/; treat that as reachable.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "${EXTRA_USERNAME}:${EXTRA_PASSWORD}" "https://${EXTRA_REGISTRY}/v2/" || true)"
          case "${code}" in
            200|401) echo "extra registry /v2/ returned ${code}" ;;
            *) echo "extra registry /v2/ returned ${code}" >&2; exit 1 ;;
          esac
