name: reusable-build-chain

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.ubuntu }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      XGC_CN_REGISTRY: ${{ secrets.XGC_CN_REGISTRY }}
      XGC_CN_NAMESPACE: ${{ secrets.XGC_CN_NAMESPACE }}
      XGC_CN_USERNAME: ${{ secrets.XGC_CN_USERNAME }}
      XGC_CN_PASSWORD: ${{ secrets.XGC_CN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.XGC_CN_REGISTRY != '' && env.XGC_CN_NAMESPACE != '' && env.XGC_CN_USERNAME != '' && env.XGC_CN_PASSWORD != ''
        with:
          registry: ${{ env.XGC_CN_REGISTRY }}
          username: ${{ env.XGC_CN_USERNAME }}
          password: ${{ env.XGC_CN_PASSWORD }}

      - name: Build ${{ matrix.ubuntu }} ${{ matrix.arch }} chain
        shell: bash
        env:
          LAYERS_JSON: ${{ matrix.layers }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          cn_image_prefix=""
          if [[ -n "${XGC_CN_REGISTRY}" && -n "${XGC_CN_NAMESPACE}" && -n "${XGC_CN_USERNAME}" && -n "${XGC_CN_PASSWORD}" ]]; then
            cn_registry="${XGC_CN_REGISTRY%/}"
            cn_namespace="${XGC_CN_NAMESPACE#/}"
            cn_namespace="${cn_namespace%/}"
            cn_image_prefix="${cn_registry}/${cn_namespace}"
          fi

          push_pids=()

          docker_push() {
            local ref="$1"
            local attempt=1
            local max=3
            while true; do
              echo ">> push ${ref} (attempt ${attempt}/${max})"
              if docker push "${ref}"; then
                echo "<< push ${ref} done"
                return 0
              fi
              if [[ "${attempt}" -ge "${max}" ]]; then
                echo "push ${ref} failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "push ${ref} failed (attempt ${attempt}/${max}), retrying" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
            done
          }

          bg_push() {
            local ref="$1"
            (
              set -euo pipefail
              docker_push "${ref}"
            ) &
            push_pids+=("$!")
          }

          wait_pushes() {
            local pid rc=0
            for pid in "${push_pids[@]+"${push_pids[@]}"}"; do
              if ! wait "${pid}"; then
                echo "registry push pid ${pid} failed" >&2
                rc=1
              fi
            done
            return "${rc}"
          }

          trap 'echo "waiting in-flight registry pushes"; wait_pushes || true' ERR

          mapfile -t steps < <(jq -c '.[]' <<<"${LAYERS_JSON}")
          for step in "${steps[@]}"; do
            app="$(jq -r '.app' <<<"${step}")"
            version="$(jq -r '.version' <<<"${step}")"
            image="$(jq -r '.image' <<<"${step}")"
            file="$(jq -r '.file' <<<"${step}")"
            context="$(jq -r '.context' <<<"${step}")"
            parent_image="$(jq -r '.parent_image' <<<"${step}")"
            no_cache="$(jq -r '.no_cache' <<<"${step}")"
            multiarch="$(jq -r '.multiarch' <<<"${step}")"
            healthcheck="$(ruby -ryaml -e 'doc = YAML.safe_load_file(ARGV[0]); puts doc.dig("entrypoints", "healthcheck").to_s' "apps/${app}/app.yml")"

            local_ref="${image}:${version}-${ARCH}"
            push_refs=("${local_ref}")
            tags=(-t "${local_ref}")
            if [[ "${multiarch}" == "true" ]]; then
              tags+=(-t "${image}:latest-${ARCH}")
              push_refs+=("${image}:latest-${ARCH}")
            else
              tags+=(-t "${image}:${version}" -t "${image}:latest")
              push_refs+=("${image}:${version}" "${image}:latest")
            fi
            if [[ -n "${cn_image_prefix}" ]]; then
              cn_ref="${cn_image_prefix}/${app}:${version}-${ARCH}"
              tags+=(-t "${cn_ref}")
              push_refs+=("${cn_ref}")
              if [[ "${multiarch}" == "true" ]]; then
                tags+=(-t "${cn_image_prefix}/${app}:latest-${ARCH}")
                push_refs+=("${cn_image_prefix}/${app}:latest-${ARCH}")
              else
                tags+=(-t "${cn_image_prefix}/${app}:${version}" -t "${cn_image_prefix}/${app}:latest")
                push_refs+=("${cn_image_prefix}/${app}:${version}" "${cn_image_prefix}/${app}:latest")
              fi
            fi

            cache_args=(--cache-from "type=gha,scope=${app}-${ARCH}" --cache-to "type=gha,mode=min,scope=${app}-${ARCH}")
            extra=()
            if [[ "${no_cache}" == "true" ]]; then
              extra+=(--no-cache)
            fi

            echo "::group::Build ${app} ${ARCH}"
            docker buildx build \
              --file "${file}" \
              --platform "${PLATFORM}" \
              --load \
              --provenance=false \
              --sbom=false \
              --build-arg "PARENT_IMAGE=${parent_image}" \
              "${cache_args[@]}" \
              "${extra[@]}" \
              "${tags[@]}" \
              "${context}"
            echo "::endgroup::"

            if [[ -n "${healthcheck}" ]]; then
              echo "::group::Smoke ${app} ${ARCH}"
              docker run --rm --platform "${PLATFORM}" "${local_ref}" bash -lc "${healthcheck}"
              echo "::endgroup::"
            fi

            # Push GHCR :version-<arch> first and wait. Two tags of the same
            # image pushed in parallel can 409/unknown blob on GHCR, which
            # then aborts the rest of the chain before full is built.
            echo "::group::Push ${app} ${ARCH} GHCR ${version}"
            docker_push "${local_ref}"
            echo "::endgroup::"

            for ref in "${push_refs[@]}"; do
              if [[ "${ref}" == "${local_ref}" ]]; then
                continue
              fi
              bg_push "${ref}"
            done
          done

          echo "::group::Wait for GHCR and ACR pushes"
          wait_pushes
          echo "::endgroup::"
