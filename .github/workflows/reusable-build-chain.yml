name: reusable-build-chain

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.ubuntu }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
      LATEST_ONLY: ${{ github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}

      - name: Build ${{ matrix.ubuntu }} ${{ matrix.arch }} chain
        shell: bash
        env:
          LAYERS_JSON: ${{ matrix.layers }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/ci-registry-roots.sh
          source scripts/ci-registry-roots.sh
          extra_prefix="${EXTRA_ROOT}"

          push_pids=()

          docker_push() {
            local ref="$1"
            local attempt=1
            local max=3
            while true; do
              echo ">> push ${ref} (attempt ${attempt}/${max})"
              if docker push "${ref}"; then
                echo "<< push ${ref} done"
                return 0
              fi
              if [[ "${attempt}" -ge "${max}" ]]; then
                echo "push ${ref} failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "push ${ref} failed (attempt ${attempt}/${max}), retrying" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
            done
          }

          bg_push() {
            local ref="$1"
            (
              set -euo pipefail
              docker_push "${ref}"
            ) &
            push_pids+=("$!")
          }

          wait_pushes() {
            local pid rc=0
            for pid in "${push_pids[@]+"${push_pids[@]}"}"; do
              if ! wait "${pid}"; then
                echo "registry push pid ${pid} failed" >&2
                rc=1
              fi
            done
            return "${rc}"
          }

          trap 'echo "waiting in-flight registry pushes"; wait_pushes || true' ERR

          mapfile -t steps < <(jq -c '.[]' <<<"${LAYERS_JSON}")
          for step in "${steps[@]}"; do
            app="$(jq -r '.app' <<<"${step}")"
            version="$(jq -r '.version' <<<"${step}")"
            image="$(rewrite_ghcr "$(jq -r '.image' <<<"${step}")")"
            file="$(jq -r '.file' <<<"${step}")"
            context="$(jq -r '.context' <<<"${step}")"
            parent_image="$(rewrite_ghcr "$(jq -r '.parent_image' <<<"${step}")")"
            no_cache="$(jq -r '.no_cache' <<<"${step}")"
            multiarch="$(jq -r '.multiarch' <<<"${step}")"
            healthcheck="$(ruby -ryaml -e 'doc = YAML.safe_load_file(ARGV[0]); puts doc.dig("entrypoints", "healthcheck").to_s' "apps/${app}/app.yml")"

            local_ref="${image}:${version}-${ARCH}"
            latest_arch_ref="${image}:latest-${ARCH}"
            tags=(-t "${local_ref}")
            push_refs=()
            if [[ "${multiarch}" == "true" ]]; then
              tags+=(-t "${latest_arch_ref}")
              if [[ "${LATEST_ONLY}" == "true" ]]; then
                push_refs+=("${latest_arch_ref}")
              else
                push_refs+=("${local_ref}" "${latest_arch_ref}")
              fi
            else
              tags+=(-t "${image}:${version}" -t "${image}:latest")
              if [[ "${LATEST_ONLY}" == "true" ]]; then
                push_refs+=("${image}:latest")
              else
                push_refs+=("${local_ref}" "${image}:${version}" "${image}:latest")
              fi
            fi
            if [[ -n "${extra_prefix}" ]]; then
              extra_version_arch="${extra_prefix}/${app}:${version}-${ARCH}"
              extra_latest_arch="${extra_prefix}/${app}:latest-${ARCH}"
              if [[ "${multiarch}" == "true" ]]; then
                tags+=(-t "${extra_latest_arch}")
                push_refs+=("${extra_latest_arch}")
                if [[ "${LATEST_ONLY}" != "true" ]]; then
                  tags+=(-t "${extra_version_arch}")
                  push_refs+=("${extra_version_arch}")
                fi
              else
                tags+=(-t "${extra_prefix}/${app}:latest")
                push_refs+=("${extra_prefix}/${app}:latest")
                if [[ "${LATEST_ONLY}" != "true" ]]; then
                  tags+=(-t "${extra_version_arch}" -t "${extra_prefix}/${app}:${version}")
                  push_refs+=("${extra_version_arch}" "${extra_prefix}/${app}:${version}")
                fi
              fi
            fi

            cache_args=(--cache-from "type=gha,scope=${app}-${ARCH}" --cache-to "type=gha,mode=min,scope=${app}-${ARCH}")
            extra=()
            if [[ "${no_cache}" == "true" ]]; then
              extra+=(--no-cache)
            fi

            echo "::group::Build ${app} ${ARCH}"
            docker buildx build \
              --file "${file}" \
              --platform "${PLATFORM}" \
              --load \
              --provenance=false \
              --sbom=false \
              --build-arg "PARENT_IMAGE=${parent_image}" \
              "${cache_args[@]}" \
              "${extra[@]}" \
              "${tags[@]}" \
              "${context}"
            echo "::endgroup::"

            if [[ -n "${healthcheck}" ]]; then
              echo "::group::Smoke ${app} ${ARCH}"
              docker run --rm --platform "${PLATFORM}" "${local_ref}" bash -lc "${healthcheck}"
              echo "::endgroup::"
            fi

            # Push one GHCR tag first and wait. Two tags of the same image
            # pushed in parallel can 409/unknown blob on GHCR, which then
            # aborts the rest of the chain before full is built.
            primary_push="${push_refs[0]}"
            echo "::group::Push ${app} ${ARCH} ${primary_push}"
            docker_push "${primary_push}"
            echo "::endgroup::"

            for ref in "${push_refs[@]}"; do
              if [[ "${ref}" == "${primary_push}" ]]; then
                continue
              fi
              bg_push "${ref}"
            done
          done

          echo "::group::Wait for registry pushes"
          wait_pushes
          echo "::endgroup::"
