name: Build changed app images

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: App key to build, or all
        required: false
        default: all

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      deleted: ${{ steps.detect.outputs.deleted }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      dependent_build_matrix: ${{ steps.detect.outputs.dependent_build_matrix }}
      mirror_matrix: ${{ steps.detect.outputs.mirror_matrix }}
      manifest_matrix: ${{ steps.detect.outputs.manifest_matrix }}
      dependent_manifest_matrix: ${{ steps.detect.outputs.dependent_manifest_matrix }}
      chain_bionic: ${{ steps.detect.outputs.chain_bionic }}
      chain_focal: ${{ steps.detect.outputs.chain_focal }}
      chain_jammy: ${{ steps.detect.outputs.chain_jammy }}
      chain_noble: ${{ steps.detect.outputs.chain_noble }}
      chain_manifest_bionic: ${{ steps.detect.outputs.chain_manifest_bionic }}
      chain_manifest_focal: ${{ steps.detect.outputs.chain_manifest_focal }}
      chain_manifest_jammy: ${{ steps.detect.outputs.chain_manifest_jammy }}
      chain_manifest_noble: ${{ steps.detect.outputs.chain_manifest_noble }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.app }}" != "all" ]]; then
            result='{"apps":["${{ github.event.inputs.app }}"],"deleted":[]}'
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            apps="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R . | jq -cs .)"
            result="$(jq -n --argjson apps "${apps}" '{apps: $apps, deleted: []}')"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            result="$(./scripts/detect-changed-apps.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          else
            result="$(./scripts/detect-changed-apps.sh "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          apps="$(jq -c '.apps' <<<"${result}")"
          deleted="$(jq -c '.deleted' <<<"${result}")"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "deleted=${deleted}" >> "$GITHUB_OUTPUT"
          echo "Changed apps: ${apps}"
          echo "Deleted apps: ${deleted}"
          ruby scripts/detect-ci-matrices.rb "${apps}"

  deleted:
    needs: detect
    if: needs.detect.outputs.deleted != '[]'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deleted app definitions detected: ${{ needs.detect.outputs.deleted }}"
          echo "Image deletion is intentionally not automated. Remove registry tags manually after confirming no deployment still references them."

  # One independent chain per Ubuntu so jammy/noble never wait on bionic/focal.
  # Within a chain: wait for GHCR :version-<arch>, then overlap remaining
  # tag pushes with the next layer compile.
  # amd64 and arm64 for the same Ubuntu run in parallel.
  build_bionic:
    needs: detect
    if: needs.detect.outputs.chain_bionic != '{"include":[]}'
    uses: ./.github/workflows/reusable-build-chain.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_bionic }}
    secrets: inherit

  manifest_bionic:
    needs:
      - detect
      - build_bionic
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.chain_manifest_bionic != '{"include":[]}' &&
      needs.build_bionic.result == 'success'
    uses: ./.github/workflows/reusable-publish-manifest.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_manifest_bionic }}
    secrets: inherit

  build_focal:
    needs: detect
    if: needs.detect.outputs.chain_focal != '{"include":[]}'
    uses: ./.github/workflows/reusable-build-chain.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_focal }}
    secrets: inherit

  manifest_focal:
    needs:
      - detect
      - build_focal
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.chain_manifest_focal != '{"include":[]}' &&
      needs.build_focal.result == 'success'
    uses: ./.github/workflows/reusable-publish-manifest.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_manifest_focal }}
    secrets: inherit

  build_jammy:
    needs: detect
    if: needs.detect.outputs.chain_jammy != '{"include":[]}'
    uses: ./.github/workflows/reusable-build-chain.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_jammy }}
    secrets: inherit

  manifest_jammy:
    needs:
      - detect
      - build_jammy
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.chain_manifest_jammy != '{"include":[]}' &&
      needs.build_jammy.result == 'success'
    uses: ./.github/workflows/reusable-publish-manifest.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_manifest_jammy }}
    secrets: inherit

  build_noble:
    needs: detect
    if: needs.detect.outputs.chain_noble != '{"include":[]}'
    uses: ./.github/workflows/reusable-build-chain.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_noble }}
    secrets: inherit

  manifest_noble:
    needs:
      - detect
      - build_noble
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.chain_manifest_noble != '{"include":[]}' &&
      needs.build_noble.result == 'success'
    uses: ./.github/workflows/reusable-publish-manifest.yml
    with:
      matrix_json: ${{ needs.detect.outputs.chain_manifest_noble }}
    secrets: inherit

  build:
    needs: detect
    if: needs.detect.outputs.build_matrix != '{"include":[]}'
    runs-on: ${{ matrix.runner }}
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail

          latest_only=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            latest_only=true
          fi

          add_tags() {
            local image="$1"
            if [[ "${{ matrix.version_only }}" == "true" && "${{ matrix.multiarch }}" != "true" ]]; then
              if [[ "${latest_only}" == "true" ]]; then
                printf '%s\n' "${image}:latest"
              else
                printf '%s\n' "${image}:${{ matrix.version }}"
              fi
            elif [[ "${latest_only}" == "true" ]]; then
              printf '%s\n' "${image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                printf '%s\n' "${image}:latest"
              fi
            else
              printf '%s\n' "${image}:${{ matrix.version }}-${{ matrix.arch }}"
              printf '%s\n' "${image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                printf '%s\n' "${image}:${{ matrix.version }}"
                printf '%s\n' "${image}:latest"
              fi
            fi
          }

          tags="$(add_tags "${{ matrix.image }}")"

          if [[ "${{ github.event_name }}" != "pull_request" && -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            tags="${tags}"$'\n'"$(add_tags "${extra_image}")"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          no-cache: ${{ matrix.no_cache }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Smoke image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          healthcheck="$(ruby -ryaml -e 'doc = YAML.safe_load_file(ARGV[0]); puts doc.dig("entrypoints", "healthcheck").to_s' "apps/${{ matrix.app }}/app.yml")"
          if [[ -z "${healthcheck}" ]]; then
            echo "No healthcheck entrypoint declared for apps/${{ matrix.app }}; image build completed."
            exit 0
          fi
          image_tag="${{ matrix.version }}-${{ matrix.arch }}"
          if [[ "${{ matrix.version_only }}" == "true" && "${{ matrix.multiarch }}" != "true" ]]; then
            image_tag="${{ matrix.version }}"
          fi
          docker run --rm "${{ matrix.image }}:${image_tag}" bash -lc "${healthcheck}"

  manifest:
    needs:
      - detect
      - build
    if: github.event_name != 'pull_request' && needs.detect.outputs.manifest_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.manifest_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1"
            local target="$2"
            shift 2
            local refs=()
            local arch
            for arch in "$@"; do
              refs+=("${image}:${target}-${arch}")
            done
            docker buildx imagetools create -t "${image}:${target}" "${refs[@]}"
          }

          mapfile -t arches < <(jq -r '.[]' <<< '${{ toJson(matrix.arches) }}')
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            create_manifest "${{ matrix.image }}" "${{ matrix.version }}" "${arches[@]}"
          fi
          create_manifest "${{ matrix.image }}" "latest" "${arches[@]}"

          if [[ -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            if [[ "${{ github.event_name }}" != "schedule" ]]; then
              create_manifest "${extra_image}" "${{ matrix.version }}" "${arches[@]}"
            fi
            create_manifest "${extra_image}" "latest" "${arches[@]}"
          fi

  dependent_build:
    needs:
      - detect
      - build
      - manifest
    if: >-
      ${{
        always() &&
        needs.detect.outputs.dependent_build_matrix != '{"include":[]}' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped') &&
        (needs.manifest.result == 'success' || needs.manifest.result == 'skipped')
      }}
    runs-on: ${{ matrix.runner }}
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.dependent_build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail

          latest_only=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            latest_only=true
          fi

          add_tags() {
            local image="$1"
            if [[ "${{ matrix.version_only }}" == "true" && "${{ matrix.multiarch }}" != "true" ]]; then
              if [[ "${latest_only}" == "true" ]]; then
                printf '%s\n' "${image}:latest"
              else
                printf '%s\n' "${image}:${{ matrix.version }}"
              fi
            elif [[ "${latest_only}" == "true" ]]; then
              printf '%s\n' "${image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                printf '%s\n' "${image}:latest"
              fi
            else
              printf '%s\n' "${image}:${{ matrix.version }}-${{ matrix.arch }}"
              printf '%s\n' "${image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                printf '%s\n' "${image}:${{ matrix.version }}"
                printf '%s\n' "${image}:latest"
              fi
            fi
          }

          tags="$(add_tags "${{ matrix.image }}")"

          if [[ "${{ github.event_name }}" != "pull_request" && -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            tags="${tags}"$'\n'"$(add_tags "${extra_image}")"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          no-cache: ${{ matrix.no_cache }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Smoke image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          healthcheck="$(ruby -ryaml -e 'doc = YAML.safe_load_file(ARGV[0]); puts doc.dig("entrypoints", "healthcheck").to_s' "apps/${{ matrix.app }}/app.yml")"
          if [[ -z "${healthcheck}" ]]; then
            echo "No healthcheck entrypoint declared for apps/${{ matrix.app }}; image build completed."
            exit 0
          fi
          image_tag="${{ matrix.version }}-${{ matrix.arch }}"
          if [[ "${{ matrix.version_only }}" == "true" && "${{ matrix.multiarch }}" != "true" ]]; then
            image_tag="${{ matrix.version }}"
          fi
          docker run --rm "${{ matrix.image }}:${image_tag}" bash -lc "${healthcheck}"

  dependent_manifest:
    needs:
      - detect
      - dependent_build
    if: github.event_name != 'pull_request' && needs.detect.outputs.dependent_manifest_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.dependent_manifest_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Publish dependent multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1"
            local target="$2"
            shift 2
            local refs=()
            local arch
            for arch in "$@"; do
              refs+=("${image}:${target}-${arch}")
            done
            docker buildx imagetools create -t "${image}:${target}" "${refs[@]}"
          }

          mapfile -t arches < <(jq -r '.[]' <<< '${{ toJson(matrix.arches) }}')
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            create_manifest "${{ matrix.image }}" "${{ matrix.version }}" "${arches[@]}"
          fi
          create_manifest "${{ matrix.image }}" "latest" "${arches[@]}"

          if [[ -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            if [[ "${{ github.event_name }}" != "schedule" ]]; then
              create_manifest "${extra_image}" "${{ matrix.version }}" "${arches[@]}"
            fi
            create_manifest "${extra_image}" "latest" "${arches[@]}"
          fi

  mirror:
    needs: detect
    if: needs.detect.outputs.mirror_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.mirror_matrix) }}
    steps:
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Mirror external image
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

          source_image="${{ matrix.source_image }}"
          if [[ -z "${source_image}" ]]; then
            echo "No source image configured for apps/${{ matrix.app }}" >&2
            exit 1
          fi

          source_manifest="$(docker manifest inspect -v "${source_image}")"
          printf '%s\n' "${source_manifest}"
          mapfile -t required_arches < <(jq -r '.[]' <<< '${{ toJson(matrix.architectures) }}')
          for arch_spec in "${required_arches[@]}"; do
            arch="${arch_spec#linux/}"
            variant=""
            if [[ "${arch}" == */* ]]; then
              variant="${arch#*/}"
              arch="${arch%%/*}"
            fi
            if ! grep -q "\"architecture\": \"${arch}\"" <<<"${source_manifest}"; then
              echo "Source image ${source_image} does not expose ${arch_spec}" >&2
              exit 1
            fi
            if [[ -n "${variant}" ]] && ! grep -q "\"variant\": \"${variant}\"" <<<"${source_manifest}"; then
              echo "Source image ${source_image} does not expose ${arch_spec}" >&2
              exit 1
            fi
          done

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "External source image is reachable: ${source_image}"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            tags="${{ matrix.image }}:latest"
          else
            tags="${{ matrix.image }}:${{ matrix.version }}"$'\n'"${{ matrix.image }}:latest"
          fi
          if [[ -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              tags="${tags}"$'\n'"${extra_image}:latest"
            else
              tags="${tags}"$'\n'"${extra_image}:${{ matrix.version }}"$'\n'"${extra_image}:latest"
            fi
          fi

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            timeout 45m skopeo copy \
              --all \
              --authfile "${HOME}/.docker/config.json" \
              "docker://${source_image}" \
              "docker://${tag}"
          done <<<"${tags}"
