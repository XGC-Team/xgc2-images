name: reusable-build-images

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
      LATEST_ONLY: ${{ github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.EXTRA_REGISTRY != '' && env.EXTRA_NAMESPACE != '' && env.EXTRA_USERNAME != '' && env.EXTRA_PASSWORD != ''
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LATEST_ONLY}" == "true" ]]; then
            tags="${{ matrix.image }}:latest-${{ matrix.arch }}"
            if [[ "${{ matrix.multiarch }}" != "true" ]]; then
              tags="${tags}"$'\n'"${{ matrix.image }}:latest"
            fi
          else
            tags="${{ matrix.image }}:${{ matrix.version }}-${{ matrix.arch }}"
            tags="${tags}"$'\n'"${{ matrix.image }}:latest-${{ matrix.arch }}"
            if [[ "${{ matrix.multiarch }}" != "true" ]]; then
              tags="${tags}"$'\n'"${{ matrix.image }}:${{ matrix.version }}"$'\n'"${{ matrix.image }}:latest"
            fi
          fi
          if [[ -n "${EXTRA_REGISTRY}" && -n "${EXTRA_NAMESPACE}" && -n "${EXTRA_USERNAME}" && -n "${EXTRA_PASSWORD}" ]]; then
            extra_registry="${EXTRA_REGISTRY%/}"
            extra_namespace="${EXTRA_NAMESPACE#/}"
            extra_namespace="${extra_namespace%/}"
            extra_image="${extra_registry}/${extra_namespace}/${{ matrix.app }}"
            if [[ "${LATEST_ONLY}" == "true" ]]; then
              tags="${tags}"$'\n'"${extra_image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                tags="${tags}"$'\n'"${extra_image}:latest"
              fi
            else
              tags="${tags}"$'\n'"${extra_image}:${{ matrix.version }}-${{ matrix.arch }}"
              tags="${tags}"$'\n'"${extra_image}:latest-${{ matrix.arch }}"
              if [[ "${{ matrix.multiarch }}" != "true" ]]; then
                tags="${tags}"$'\n'"${extra_image}:${{ matrix.version }}"$'\n'"${extra_image}:latest"
              fi
            fi
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          no-cache: ${{ matrix.no_cache }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PARENT_IMAGE=${{ matrix.parent_image }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Smoke image
        shell: bash
        run: |
          set -euo pipefail
          healthcheck="$(ruby -ryaml -e 'doc = YAML.safe_load_file(ARGV[0]); puts doc.dig("entrypoints", "healthcheck").to_s' "apps/${{ matrix.app }}/app.yml")"
          if [[ -z "${healthcheck}" ]]; then
            echo "No healthcheck entrypoint declared for apps/${{ matrix.app }}; image build completed."
            exit 0
          fi
          image="${{ matrix.image }}:${{ matrix.version }}-${{ matrix.arch }}"
          docker pull --platform "${{ matrix.platform }}" "${image}"
          docker run --rm --platform "${{ matrix.platform }}" "${image}" bash -lc "${healthcheck}"
