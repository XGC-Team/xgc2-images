name: ROS1 Simulation Kit
title: ROS Noetic simulation toolkit
additionalProperties:
  key: xgc-ros1-runtime
  name: ROS1 Simulation Kit
  tags:
    - Noetic
    - MAVROS
    - VRPN
    - Gazebo Classic
  shortDescEn: ROS Noetic, MAVROS, VRPN, Gazebo Classic and common simulation tools.
  description:
    en: Curated multi-architecture ROS Noetic toolkit for robot simulation workflows without desktop application bundles.
  type: simulation
  crossVersionUpdate: true
  limit: 0
  website: https://wiki.ros.org/noetic
  github: https://github.com/XGC-Team/xgc2-images
  document: https://github.com/XGC-Team/xgc2-images/tree/master/apps/xgc-ros1-runtime
  architectures:
    - amd64
    - arm64/v8
  batchInstallSupport: true
  formFields:
    - default: xgc-ros1-runtime
      envKey: CONTAINER_NAME
      label:
        en: Container name
      required: true
      type: text
    - default: http://127.0.0.1:11311
      envKey: ROS_MASTER_URI
      label:
        en: ROS master URI
      required: true
      type: text
    - default: 127.0.0.1
      envKey: ROS_IP
      label:
        en: ROS IP
      required: true
      type: text
    - default: xgc2-ros1-ws
      envKey: XGC_WORKSPACE
      label:
        en: Workspace directory under XGC host workspace
      required: true
      type: text
    - default: XGC/Documents
      envKey: XGC_DOCUMENTS
      label:
        en: Documents directory under XGC host workspace
      required: true
      type: text
