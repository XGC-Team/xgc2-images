services:
  onboard-sim-wheeltec-bionic-melodic:
    image: ghcr.io/xgc-team/xgc2-images/onboard-sim-wheeltec-bionic-melodic:1.0.0
    container_name: ${CONTAINER_NAME}
    stdin_open: true
    tty: true
    environment:
      XGC_AGENT_ID: ${XGC_AGENT_ID}
      XGC_AGENT_DISPLAY_NAME: ${XGC_AGENT_DISPLAY_NAME:-}
      XGC_AGENT_GRPC_ADDR: ${XGC_AGENT_GRPC_ADDR:-:9090}
      XGC_CORE_ENDPOINT: ${XGC_CORE_ENDPOINT}
      XGC_AGENT_ADVERTISED_ENDPOINT: ${XGC_AGENT_ADVERTISED_ENDPOINT}
      XGC_AGENT_DATA_DIR: ${XGC_AGENT_DATA_DIR:-/var/lib/xgc2-agent}
      XGC_AGENT_MANAGED_ROOT: ${XGC_AGENT_MANAGED_ROOT:-/var/lib/xgc2-managed}
      XGC_PROCESS_DEFINITION_PLUGINS: ${XGC_PROCESS_DEFINITION_PLUGINS:-/usr/share/xgc2-agent/process-definitions}
      ROS_MASTER_URI: ${ROS_MASTER_URI:-}
      ROS_IP: ${ROS_IP:-}
      ROS_HOSTNAME: ${ROS_HOSTNAME:-}
    healthcheck:
      test: ["CMD", "/opt/xgc2/onboard-baseline/image-healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 3
