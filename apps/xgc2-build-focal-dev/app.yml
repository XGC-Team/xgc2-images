key: xgc2-build-focal-dev
name: XGC2 focal CI dev
version: 1.0.0
image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
dependsOnApp: xgc2-build-focal-base
description: Ubuntu focal CI compile and Debian packaging image with compilers, Node, pnpm, uv, Go, Rust, and packaging tools. No ROS and no XGC2 APT packages.
type: build
buildLayer: dev
tags:
  - Build
  - CI
  - Focal
architectures:
  - amd64
  - arm64/v8
license: Apache-2.0
source: https://github.com/XGC-Team/xgc2-images
entrypoints:
  shell: /bin/bash
  healthcheck: /usr/local/bin/xgc2-build-healthcheck
