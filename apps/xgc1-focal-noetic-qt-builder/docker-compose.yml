services:
  xgc1-focal-noetic-qt-builder:
    image: ghcr.io/xgc-team/xgc2-images/xgc1-focal-noetic-qt-builder:1.0.4
    container_name: ${CONTAINER_NAME}
    environment:
      DISABLE_ROS1_EOL_WARNINGS: "1"
    stdin_open: true
    tty: true
    command: ["bash"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/xgc1-qt-builder-healthcheck"]
      interval: 1m
      timeout: 30s
      retries: 2
      start_period: 30s
