services:
  onboard-sim-scout-focal-noetic:
    image: ghcr.io/xgc-team/xgc2-images/onboard-sim-scout-focal-noetic:latest
    container_name: ${CONTAINER_NAME}
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/opt/xgc2/onboard-baseline/image-healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 3
